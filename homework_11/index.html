<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
	<!-- <link rel="stylesheet" href="css/reset.css"> -->
	<link rel="stylesheet" href="css/style.css">
	<title>Homework_11</title>
</head>

<body>
	<div class="wrapper">
		<header class="header">
		</header>
		<main class="page">
			<div class="page__container">
				<h1 class="page__title">CSS Transform</h1>
				<div class="page__transform transform">
					<div class="transform__2d">
						<div class="translate">
							<div class="translate__item">Translate</div>
						</div>
						<div class="scale">
							<div class="scale__item">Scale</div>
						</div>
						<div class="rotate">
							<div class="rotate__item">Rotate</div>
						</div>
					</div>
					<div class="transform__3d">
						<div class="translate3d">
							<div class="translate3d__item">Translate 3D</div>
						</div>
						<div class="rotate3d">
							<div class="rotate3d__item">Rotate 3D</div>
						</div>
					</div>
				</div>
			</div>
			<div class="car-scene scene-sedan">
				<div class="grid-floor"></div>
				<div class="retro-sun"></div>
				<div class="sedan">
					<div class="sedan-body">
						<div class="sedan-glass"></div>
						<div class="sedan-neon"></div>
						<div class="sedan-headlight"></div>
						<div class="sedan-tail"></div>
						<div class="sedan-diffuser"></div>
						<div class="sedan-wheels">
							<div class="sedan-wheel"></div>
							<div class="sedan-wheel"></div>
						</div>
					</div>
				</div>
			</div>
</main>
	<footer class="footer"></footer>
</body>

</html>
